<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Listen Live | Glowwave-FM Gold Edition</title>
    <meta name="description" content="Listen live to Glowwave-FM. Playing the best mix of reggae, dancehall, and timeless classics.">
    <meta name="keywords" content="Glowwave-FM, reggae, dancehall, live radio, internet radio, streaming, roots">
    <meta name="author" content="The Glow-Network">
    <meta name="robots" content="index, follow">
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="https://glownetwork.net/the-glow-network.png">
    <meta name="theme-color" content="#1a1814">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warmDark: '#1a1814',
                        warmPanel: '#2a2620',
                        rastaRed: '#D21034',
                        rastaGold: '#FFD100',
                        rastaGreen: '#007749',
                    },
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
                            '50%': { opacity: '1', transform: 'scale(1.02)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #1a1814;
            color: #f4f1ea;
            background-image: radial-gradient(circle at top right, rgba(210, 16, 52, 0.05), transparent 40%),
                              radial-gradient(circle at center, rgba(255, 209, 0, 0.05), transparent 50%),
                              radial-gradient(circle at bottom left, rgba(0, 119, 73, 0.05), transparent 40%);
            min-height: 100vh;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #FFD100;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(255, 209, 0, 0.5);
        }
        
        .glass-panel {
            background: rgba(42, 38, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 209, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .visualizer-bar {
            width: 5px;
            border-radius: 2px;
            display: inline-block;
            margin: 0 2px;
            transition: height 0.1s ease;
            opacity: 0.8;
        }
        
        .pause-spin {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-8">

    <nav class="w-full max-w-4xl mx-auto flex justify-between items-center py-6 mb-8 relative z-10">
        <a href="https://glowwavefm.com/" class="flex items-center gap-3 group">
            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-rastaGold shadow-[0_0_15px_rgba(255,209,0,0.3)]">
                <img src="https://glownetwork.net/the-glow-network.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="font-display font-bold text-2xl tracking-wide text-white drop-shadow-md">GLOWWAVE<span class="text-rastaGold">-FM</span></span>
        </a>
        <div class="hidden sm:flex gap-6 text-sm font-bold tracking-wider text-gray-300 uppercase">
            <a href="https://glowwavefm.com/" class="hover:text-rastaGold transition-colors">Home</a>
            <a href="#" class="text-rastaGold drop-shadow-[0_0_5px_rgba(255,209,0,0.5)]">Listen Live</a>
            <a href="https://glowwavefm.com/contact" class="hover:text-rastaGold transition-colors">Contact</a>
        </div>
    </nav>

    <main class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 relative z-10 flex flex-col items-center">
        
        <div class="absolute top-6 right-6 flex items-center gap-2 bg-black/40 text-rastaRed px-3 py-1 rounded-full text-xs font-bold tracking-wider border border-rastaRed/30">
            <span class="w-2 h-2 rounded-full bg-rastaRed animate-pulse shadow-[0_0_5px_#D21034]"></span>
            ON AIR
        </div>

        <div class="relative w-48 h-48 sm:w-56 sm:h-56 mt-4 mb-8">
            <div class="absolute inset-0 rounded-full border-4 border-black/50 shadow-2xl"></div>
            
            <div id="vinyl-record" class="w-full h-full rounded-full bg-[#111] shadow-2xl relative overflow-hidden flex items-center justify-center border-2 border-[#222] animate-spin-slow pause-spin">
                <div class="absolute inset-1 rounded-full border border-white/5"></div>
                <div class="absolute inset-3 rounded-full border border-white/5"></div>
                <div class="absolute inset-6 rounded-full border border-white/5"></div>
                <div class="absolute inset-10 rounded-full border border-white/5"></div>
                <div class="absolute inset-14 rounded-full border border-white/5"></div>
                
                <div class="w-20 h-20 rounded-full bg-rastaGold border-4 border-[#111] flex items-center justify-center relative z-10 overflow-hidden shadow-inner">
                    <img src="https://glownetwork.net/the-glow-network.png" alt="Vinyl Label Logo" class="w-full h-full object-cover opacity-90">
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-black border border-gray-700"></div>
                </div>
            </div>

            <div id="tonearm" class="absolute -top-4 -right-4 w-12 h-32 sm:h-40 z-20 transition-transform duration-700 ease-in-out" style="transform-origin: 24px 24px; transform: rotate(-30deg);">
                <div class="absolute top-0 left-0 w-12 h-12 rounded-full bg-gradient-to-b from-gray-300 to-gray-600 border-4 border-[#1a1a1a] shadow-xl flex items-center justify-center z-30">
                    <div class="w-4 h-4 rounded-full bg-black shadow-inner"></div>
                </div>
                <div class="absolute top-8 left-5 w-2 h-24 sm:h-32 bg-gradient-to-r from-gray-300 via-gray-400 to-gray-500 rounded-full shadow-[5px_5px_10px_rgba(0,0,0,0.5)] z-20"></div>
                <div class="absolute bottom-0 sm:-bottom-2 left-3 w-6 h-10 bg-gradient-to-b from-[#222] to-[#000] rounded-t-sm rounded-b-lg border-2 border-gray-600 shadow-lg z-20 transform -rotate-12">
                    <div class="absolute bottom-1 right-1 w-1 h-2 bg-rastaRed rounded-full shadow-[0_0_5px_#D21034]"></div>
                </div>
            </div>
        </div>

        <div class="text-center w-full mb-6">
            <h1 class="font-display text-3xl sm:text-4xl font-bold text-white mb-1 uppercase tracking-wide">Glowwave-FM</h1>
            <p class="text-rastaGold text-sm font-semibold mb-1 uppercase tracking-widest">Roots • Reggae • Dancehall</p>
            <p class="text-gray-400 text-xs italic">Timeless Classics & Island Vibes</p>
        </div>

        <div id="visualizer-container" class="h-12 w-full flex items-end justify-center gap-[3px] mb-8 opacity-50 transition-opacity duration-300">
        </div>

        <div class="w-full flex flex-col gap-6">
            
            <audio id="radio-audio" crossorigin="anonymous">
                <source src="https://wavehub.uk/api/functions/stationStream?uuid=1cf33481-5bc1-4e66-a95f-9d5278542df1" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <div class="flex items-center justify-center gap-8">
                <button id="mute-btn" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition-colors" aria-label="Mute/Unmute">
                    <i class="fas fa-volume-up text-xl"></i>
                </button>

                <button id="play-pause-btn" class="w-16 h-16 rounded-full bg-gradient-to-br from-rastaRed via-rastaGold to-rastaGreen flex items-center justify-center text-black shadow-[0_0_20px_rgba(255,209,0,0.3)] hover:scale-105 hover:shadow-[0_0_25px_rgba(255,209,0,0.5)] transition-all duration-300 relative group" aria-label="Play/Pause">
                    <div class="absolute inset-1 bg-warmDark rounded-full flex items-center justify-center group-hover:bg-[#2a2620] transition-colors">
                        <i id="loading-spinner" class="fas fa-circle-notch fa-spin text-2xl text-rastaGold hidden"></i>
                        <i id="play-icon" class="fas fa-play text-2xl text-white ml-1"></i>
                        <i id="pause-icon" class="fas fa-pause text-2xl text-white hidden"></i>
                    </div>
                </button>

                <button id="share-btn" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition-colors relative" aria-label="Share">
                    <i class="fas fa-share-nodes text-xl"></i>
                    <div id="share-tooltip" class="absolute -top-10 bg-black text-rastaGold text-xs px-2 py-1 rounded opacity-0 transition-opacity duration-200 pointer-events-none whitespace-nowrap border border-rastaGold/30">
                        Link Copied!
                    </div>
                </button>
            </div>

            <div class="flex items-center gap-3 w-full max-w-xs mx-auto px-4 mt-2">
                <i class="fas fa-volume-down text-gray-500 text-xs"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
                <i class="fas fa-volume-up text-gray-500 text-xs"></i>
            </div>
            
            <div class="text-center mt-2 flex justify-center items-center gap-2">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-gray-500"></div>
                <span id="player-status" class="text-xs font-bold text-gray-400 uppercase tracking-widest">Ready to Play</span>
            </div>
        </div>
    </main>

    <div class="w-full max-w-md mt-8 flex flex-wrap justify-center gap-2 relative z-10">
        <span class="px-3 py-1 rounded-full bg-black/30 border border-white/5 text-xs text-gray-300 font-bold">Roots</span>
        <span class="px-3 py-1 rounded-full bg-black/30 border border-white/5 text-xs text-gray-300 font-bold">Dancehall</span>
        <span class="px-3 py-1 rounded-full bg-black/30 border border-white/5 text-xs text-gray-300 font-bold">Dub</span>
        <span class="px-3 py-1 rounded-full bg-black/30 border border-white/5 text-xs text-gray-300 font-bold">Classics</span>
    </div>

    <footer class="mt-12 text-center text-gray-500 text-xs relative z-10 w-full max-w-4xl mx-auto border-t border-white/10 pt-6">
        <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mb-4 font-bold">
            <a href="https://glowwavefm.com/privacy" class="hover:text-rastaGold transition-colors">Privacy Policy</a>
            <span class="hidden sm:inline">•</span>
            <a href="https://glowwavefm.com/terms" class="hover:text-rastaGold transition-colors">Terms of Service</a>
            <span class="hidden sm:inline">•</span>
            <a href="https://glownetwork.net/" class="hover:text-rastaGold transition-colors">The Glow-Network</a>
        </div>
        <p>&copy; 2026 The Glow-Network. All rights reserved.</p>
        <p class="mt-1">Inquiries: <a href="mailto:NOVOHC-499@proton.me" class="text-rastaGold hover:underline">NOVOHC-499@proton.me</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('radio-audio');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const loadingSpinner = document.getElementById('loading-spinner');
            const volumeSlider = document.getElementById('volume-slider');
            const muteBtn = document.getElementById('mute-btn');
            const muteIcon = muteBtn.querySelector('i');
            const playerStatus = document.getElementById('player-status');
            const statusDot = document.getElementById('status-dot');
            
            const vinylRecord = document.getElementById('vinyl-record');
            const tonearm = document.getElementById('tonearm');
            const visualizerContainer = document.getElementById('visualizer-container');
            const shareBtn = document.getElementById('share-btn');
            const shareTooltip = document.getElementById('share-tooltip');
            
            const faviconLink = document.getElementById('dynamic-favicon');
            const defaultFavicon = "https://glownetwork.net/the-glow-network.png";

            let isPlaying = false;
            let currentVolume = 0.8;
            audio.volume = currentVolume;

            const numBars = 32;
            for (let i = 0; i < numBars; i++) {
                const bar = document.createElement('div');
                bar.classList.add('visualizer-bar');
                bar.style.height = '4px';
                
                if (i < numBars * 0.33) {
                    bar.style.backgroundColor = '#007749';
                } else if (i < numBars * 0.66) {
                    bar.style.backgroundColor = '#FFD100';
                } else {
                    bar.style.backgroundColor = '#D21034';
                }
                
                visualizerContainer.appendChild(bar);
            }
            const bars = document.querySelectorAll('.visualizer-bar');

            let audioContext;
            let analyser;
            let dataArray;
            let source;
            let animationId;
            
            const faviconCanvas = document.createElement('canvas');
            faviconCanvas.width = 32;
            faviconCanvas.height = 32;
            const faviconCtx = faviconCanvas.getContext('2d');

            function setupMediaSession() {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: 'Live 24/7 Broadcast',
                        artist: 'Glowwave-FM',
                        album: 'Reggae • Dancehall • Classics',
                        artwork: [
                            { src: 'https://glownetwork.net/the-glow-network.png', sizes: '96x96', type: 'image/png' },
                            { src: 'https://glownetwork.net/the-glow-network.png', sizes: '128x128', type: 'image/png' },
                            { src: 'https://glownetwork.net/the-glow-network.png', sizes: '192x192', type: 'image/png' },
                            { src: 'https://glownetwork.net/the-glow-network.png', sizes: '256x256', type: 'image/png' },
                            { src: 'https://glownetwork.net/the-glow-network.png', sizes: '384x384', type: 'image/png' },
                            { src: 'https://glownetwork.net/the-glow-network.png', sizes: '512x512', type: 'image/png' }
                        ]
                    });

                    navigator.mediaSession.setActionHandler('play', () => { 
                        if(audio.paused) togglePlay(); 
                    });
                    navigator.mediaSession.setActionHandler('pause', () => { 
                        if(!audio.paused) togglePlay(); 
                    });
                }
            }

            function setupWebAudio() {
                if (audioContext) return;
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                
                analyser.fftSize = 64;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }

            function updateVisualizers() {
                if (!isPlaying) return;

                analyser.getByteFrequencyData(dataArray);

                bars.forEach((bar, index) => {
                    const dataIndex = Math.floor((index / bars.length) * (dataArray.length * 0.7)); 
                    const value = dataArray[dataIndex];
                    const height = Math.max(4, (value / 255) * 48);
                    bar.style.height = `${height}px`;
                });

                faviconCtx.clearRect(0, 0, faviconCanvas.width, faviconCanvas.height);
                faviconCtx.fillStyle = '#1a1814'; 
                faviconCtx.fillRect(0, 0, 32, 32);
                
                const barWidth = 32 / (dataArray.length / 2);
                for (let i = 0; i < dataArray.length / 2; i++) {
                    const value = dataArray[i];
                    const barHeight = (value / 255) * 32;
                    
                    if (i < (dataArray.length/2) * 0.33) {
                        faviconCtx.fillStyle = '#007749';
                    } else if (i < (dataArray.length/2) * 0.66) {
                        faviconCtx.fillStyle = '#FFD100';
                    } else {
                        faviconCtx.fillStyle = '#D21034';
                    }

                    faviconCtx.fillRect(i * barWidth, 32 - barHeight, barWidth - 1, barHeight);
                }

                faviconLink.href = faviconCanvas.toDataURL('image/png');

                animationId = requestAnimationFrame(updateVisualizers);
            }

            function startVisualizer() {
                visualizerContainer.style.opacity = '1';
                vinylRecord.classList.remove('pause-spin');
                tonearm.style.transform = 'rotate(15deg)';
                
                setupWebAudio();
                if(audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                if(!animationId) {
                    updateVisualizers();
                }
            }

            function stopVisualizer() {
                visualizerContainer.style.opacity = '0.5';
                vinylRecord.classList.add('pause-spin');
                tonearm.style.transform = 'rotate(-30deg)';
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                bars.forEach(bar => bar.style.height = '4px');
                faviconLink.href = defaultFavicon;
            }

            function togglePlay() {
                if (audio.paused) {
                    playIcon.classList.add('hidden');
                    loadingSpinner.classList.remove('hidden');
                    playerStatus.textContent = 'CONNECTING...';
                    playerStatus.classList.add('text-rastaGold');
                    playerStatus.classList.remove('text-gray-400');
                    statusDot.className = 'w-2 h-2 rounded-full bg-rastaGold animate-pulse';

                    audio.play().then(() => {
                        isPlaying = true;
                        loadingSpinner.classList.add('hidden');
                        pauseIcon.classList.remove('hidden');
                        playerStatus.textContent = 'BROADCASTING LIVE';
                        statusDot.className = 'w-2 h-2 rounded-full bg-rastaRed shadow-[0_0_8px_#D21034] animate-pulse';
                        setupMediaSession();
                        startVisualizer();
                    }).catch(error => {
                        console.error(error);
                        loadingSpinner.classList.add('hidden');
                        playIcon.classList.remove('hidden');
                        playerStatus.textContent = 'CONNECTION FAILED';
                        playerStatus.classList.remove('text-rastaGold');
                        playerStatus.classList.add('text-rastaRed');
                        statusDot.className = 'w-2 h-2 rounded-full bg-rastaRed';
                        isPlaying = false;
                    });
                } else {
                    audio.pause();
                    audio.src = audio.currentSrc;
                    
                    isPlaying = false;
                    pauseIcon.classList.add('hidden');
                    playIcon.classList.remove('hidden');
                    playerStatus.textContent = 'STREAM PAUSED';
                    playerStatus.classList.remove('text-rastaGold', 'text-rastaRed');
                    playerStatus.classList.add('text-gray-400');
                    statusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
                    stopVisualizer();
                }
            }

            playPauseBtn.addEventListener('click', togglePlay);

            volumeSlider.addEventListener('input', (e) => {
                const value = e.target.value;
                audio.volume = value;
                currentVolume = value;
                
                if (value == 0) {
                    muteIcon.className = 'fas fa-volume-xmark text-xl text-rastaRed';
                } else if (value < 0.5) {
                    muteIcon.className = 'fas fa-volume-down text-xl';
                } else {
                    muteIcon.className = 'fas fa-volume-up text-xl';
                }
            });

            muteBtn.addEventListener('click', () => {
                if (audio.volume > 0) {
                    audio.volume = 0;
                    volumeSlider.value = 0;
                    muteIcon.className = 'fas fa-volume-xmark text-xl text-rastaRed';
                } else {
                    audio.volume = currentVolume > 0 ? currentVolume : 0.8;
                    volumeSlider.value = audio.volume;
                    muteIcon.className = audio.volume < 0.5 ? 'fas fa-volume-down text-xl' : 'fas fa-volume-up text-xl';
                }
            });

            audio.addEventListener('waiting', () => {
                if(isPlaying) {
                    pauseIcon.classList.add('hidden');
                    loadingSpinner.classList.remove('hidden');
                    playerStatus.textContent = 'BUFFERING...';
                    statusDot.className = 'w-2 h-2 rounded-full bg-rastaGold animate-pulse';
                    stopVisualizer(); 
                }
            });

            audio.addEventListener('playing', () => {
                loadingSpinner.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                playerStatus.textContent = 'BROADCASTING LIVE';
                statusDot.className = 'w-2 h-2 rounded-full bg-rastaRed shadow-[0_0_8px_#D21034] animate-pulse';
                startVisualizer();
            });

            audio.addEventListener('error', (e) => {
                loadingSpinner.classList.add('hidden');
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                playerStatus.textContent = 'STREAM OFFLINE';
                playerStatus.classList.remove('text-rastaGold');
                playerStatus.classList.add('text-rastaRed');
                statusDot.className = 'w-2 h-2 rounded-full bg-rastaRed';
                stopVisualizer();
                isPlaying = false;
            });

            shareBtn.addEventListener('click', () => {
                const url = window.location.href;
                const textArea = document.createElement("textarea");
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    shareTooltip.classList.remove('opacity-0');
                    setTimeout(() => {
                        shareTooltip.classList.add('opacity-0');
                    }, 2000);
                } catch (err) {
                }
                document.body.removeChild(textArea);
            });
        });
    </script>
</body>
</html>
